name: HYDRA-UMC CI baseline

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  baseline:
    name: Validate project baseline
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Run the baseline steps of the family
        uses: ./.github/actions/hydra-baseline
      - name: Lint and type-check
        run: |
          python -m pip install ruff==0.17.1 mypy==2.4.0
          python -m ruff check --select F,E9,B agent provisioning tools
          cd agent && python -m mypy src
      - name: Validate provisioning shell scripts
        # Found while auditing the code: CI
        # validated Python/Node syntax and tests but never checked the
        # ~30 provisioning/install_*.sh scripts that are this repo's
        # actual deliverable - a shell syntax error only ever surfaced by
        # running it on a real CM5. `bash -n` (syntax-only, no execution)
        # is the cheap, zero-false-positive half of that fix; shellcheck
        # itself would also lint style/quoting and is worth a real,
        # separate pass once its own findings across ~30 scripts have
        # been triaged, not bundled in here unreviewed.
        if: ${{ hashFiles('provisioning/**/*.sh') != '' }}
        shell: bash
        run: |
          fail=0
          count=0
          while IFS= read -r -d '' script; do
            count=$((count + 1))
            if ! bash -n "$script"; then
              echo "SHELL_SYNTAX=FAIL $script"
              fail=1
            fi
          done < <(find provisioning -name '*.sh' -print0)
          if [ "$fail" -ne 0 ]; then
            exit 1
          fi
          echo "SHELL_SYNTAX=PASS files=$count"
      - name: Check out HYDRA-UMC-SDK as a real sibling checkout
        # provisioning/verify_install_and_recovery.sh below needs a real
        # sibling HYDRA-UMC-SDK checkout - the same real dependency
        # preflight_cm5.py's own SDK_OS_CONTRACT check already requires
        # for a non-degraded pass, same convention every other cross-repo
        # tool in this ecosystem already uses.
        #
        # Real CI bug found and fixed here: actions/checkout@v5's own
        # `path` input refuses to resolve outside `$GITHUB_WORKSPACE` (a
        # deliberate security boundary in the action itself) - this step
        # had been failing on EVERY real run since it was introduced,
        # because `../HYDRA-UMC-SDK` is, by construction, one level
        # above the workspace. A plain `git clone` via `run:` has no
        # such restriction (it's an ordinary shell command against an
        # ordinary writable directory on the runner - the workspace's
        # own parent, not some root-owned system path), so it reaches
        # the exact same real sibling layout this repo's own scripts
        # already expect, without inventing a different path convention
        # just to satisfy the Action's own boundary check.
        if: ${{ hashFiles('provisioning/verify_install_and_recovery.sh') != '' }}
        shell: bash
        run: git clone --depth 1 https://github.com/JuanenRac/HYDRA-UMC-SDK.git ../HYDRA-UMC-SDK
      - name: Real --apply install + a real backup/wipe/restore cycle
        # Found in the same pass verify_install_and_recovery.sh's own
        # header comment documents: CI only ever ran `bash -n` against
        # these scripts (the step above) - a real --apply run and a real
        # backup/wipe/restore cycle had never been exercised anywhere
        # except by hand, directly on a real CM5. `ubuntu-latest` is a
        # real, disposable systemd-based VM per run - safe to genuinely
        # mutate (real users/directories/systemd units), unlike a real
        # CM5 or a developer's own workstation.
        if: ${{ hashFiles('provisioning/verify_install_and_recovery.sh') != '' }}
        shell: bash
        run: sudo bash provisioning/verify_install_and_recovery.sh
      - name: Test HYDRA-UMC-OS agent deployment contract
        if: ${{ hashFiles('agent/tests/test_agent.py') != '' }}
        env:
          PYTHONPATH: agent/src
        run: |
          python -m unittest discover -s agent/tests -v
          python tools/verify_agent_deployment_contract.py
      - name: Test signed packages, the certificate authority script, the firewall rules and the encrypted backup
        if: ${{ hashFiles('tools/verify_package_component.py') != '' }}
        shell: bash
        run: |
          python tools/verify_package_component.py
          python tools/verify_deploy_release.py
          python tools/verify_deploy_tree.py
          python tools/verify_install_plan.py
          python tools/verify_mqtt_tls.py
          python tools/verify_firewall.py
          python tools/verify_optional_journals.py
          python tools/verify_service_registry.py
          python tools/verify_gateway_installer.py
          python tools/verify_kiosk_installer.py
          python tools/verify_backup_settings.py
          python tools/verify_os_guard_and_docs.py
          python tools/verify_bump_version.py
          python tools/verify_device_identity.py
          python tools/verify_deb_package.py
