# Started by hand only (workflow_dispatch): it never runs on a push or a pull request, so it cannot turn the checks of a push red.
#
# In a Debian trixie container (the release of the CM5 image) with no screen and no GPU it runs the installer in dry-run for the two sessions and then starts the real
# session script of the Wayland kiosk: the real cage on the headless backend and the real Chromium on Wayland, as the locked kiosk account. It proves that the plan
# and the session start and stay up; it does not draw on an HDMI display and it does not use the seat of tty1 (that needs the board). It holds no key, uploads nothing
# and publishes nothing.

name: Wayland kiosk on a virtual screen (manual)

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: kiosk-wayland
  cancel-in-progress: false

jobs:
  kiosk:
    name: cage and chromium on a virtual screen
    runs-on: ubuntu-latest
    timeout-minutes: 25
    permissions:
      contents: read
    steps:
      - name: Check out this repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Run the session in a trixie container
        shell: bash
        run: |
          set -euo pipefail
          cp tools/kiosk_wayland_check.sh "$RUNNER_TEMP/check.sh"
          docker run --rm -v "$GITHUB_WORKSPACE:/work:ro" -v "$RUNNER_TEMP/check.sh:/check.sh:ro" debian:trixie bash /check.sh | tee "$RUNNER_TEMP/kiosk.log"
          { echo "### Wayland kiosk on a virtual screen"; echo '```'; cat "$RUNNER_TEMP/kiosk.log"; echo '```'; } >> "$GITHUB_STEP_SUMMARY"
