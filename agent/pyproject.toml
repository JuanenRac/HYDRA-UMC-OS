[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "hydra-umc-os-agent"
version = "0.0.5"
description = "Read-only node diagnostics and lifecycle agent for HYDRA-UMC-OS"
requires-python = ">=3.11"
license = {text = "GPL-3.0-or-later"}

[project.scripts]
hydra-umc-agent = "hydra_umc_os.agent:main"

[tool.setuptools.packages.find]
where = ["src"]
